name: SB HK Node Sweep

on:
  workflow_dispatch:

jobs:
  sweep:
    name: Python-driven HK node sweep for GHCR
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Sweep
        shell: bash
        run: |
          set -uo pipefail
          cp /data/singbox/config.json /data/singbox/config.json.bak-hksweep2
          python3 - <<'PYEOF'
          import json, subprocess, time, shutil

          CFG = "/data/singbox/config.json"
          BAK = "/data/singbox/config.json.bak-hksweep2"
          DOMAINS = ["ghcr.io", "pkg-containers.githubusercontent.com",
                     "objects.githubusercontent.com", "githubusercontent.com",
                     "githubassets.com"]

          def run(cmd, timeout=60):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)

          def patch(tag):
              cfg = json.load(open(BAK))
              rule = {"domain_suffix": DOMAINS, "outbound": tag}
              cfg.setdefault("route", {}).setdefault("rules", []).insert(0, rule)
              json.dump(cfg, open(CFG, "w"), ensure_ascii=False, indent=2)

          def curl_code():
              r = run("curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -x http://127.0.0.1:7890 https://ghcr.io/v2/", timeout=25)
              out = r.stdout.strip()
              return out if out else f"ERR{r.returncode}"

          cfg = json.load(open(CFG))
          hk_tags = [ob["tag"] for ob in cfg.get("outbounds", [])
                     if ob.get("tag", "").startswith("\U0001F1ED\U0001F1F0")]
          print("HK nodes found:", hk_tags)

          winner = None
          for tag in hk_tags:
              print(f"==== node: {tag} ====")
              patch(tag)
              chk = run("docker exec sing-box sing-box check -c /etc/sing-box/config.json")
              if chk.returncode != 0:
                  print("  config check failed:", chk.stderr.strip()[:120]); continue
              run("docker restart sing-box"); time.sleep(8)
              code = curl_code()
              print(f"  ghcr /v2/ => http={code}")
              if code == "401":
                  winner = tag; break

          if not winner:
              print("NO HK NODE REACHED GHCR")
              shutil.copy(BAK, CFG)
              run("docker restart sing-box"); time.sleep(6)
              print("restored original config")
              raise SystemExit(0)

          print(f"==== WINNER: {winner} ====")
          r = run("curl -sS --max-time 15 -x http://127.0.0.1:7890 https://www.cloudflare.com/cdn-cgi/trace")
          for line in r.stdout.splitlines():
              if line.startswith(("loc=", "colo=")): print(" ", line)
          IMAGE = "ghcr.io/wangshun-china/lumina-rpc:dashboard7a824ba222bcb4d939495973e92efa263d69cbfb"
          run(f"docker image rm {IMAGE} >/dev/null 2>&1")
          start = time.time()
          pr = run(f"timeout 300 docker pull {IMAGE}", timeout=320)
          secs = int(time.time() - start)
          if pr.returncode == 0:
              size = int(run(f"docker image inspect {IMAGE} --format '{{{{.Size}}}}'").stdout.strip() or 0)
              mbs = size // 1048576
              print(f"RESULT node={winner} pulled {mbs}MB in {secs}s => {mbs*1024//max(secs,1)} KB/s")
          else:
              print(f"RESULT node={winner} PULL FAILED rc={pr.returncode} (300s cap)")
          print("NOTE: winner route left in place; rollback file:", BAK)
          PYEOF
