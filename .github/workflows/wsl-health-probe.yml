name: WSL CC Health Probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Listening ports and root paths
    runs-on: [self-hosted, wsl]
    steps:
      - name: Netstat inside containers
        shell: bash
        run: |
          set +e
          for c in code-craft-user-service code-craft-screenshot-service code-craft-app-service; do
            echo "==== $c listening ===="
            docker exec "$c" netstat -tln 2>/dev/null | head -8 || docker exec "$c" cat /proc/net/tcp >/dev/null 2>&1 && echo "(netstat missing)"
          done

      - name: Root and known API paths
        shell: bash
        run: |
          set +e
          for pair in "code-craft-user-service:8124" "code-craft-screenshot-service:8127"; do
            c="${pair%%:*}"; p="${pair##*:}"
            for path in "/" "/api/user/login" "/api/screenshot/health"; do
              printf "%s %s => " "$c" "$path"
              docker exec "$c" wget -S -qO- --timeout=6 "http://127.0.0.1:$p$path" 2>&1 | grep -m1 "HTTP/" || echo "no-response"
            done
          done
