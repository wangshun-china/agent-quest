name: SB Sub Refresh Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Read refresh script rule template section
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Show rule-building section of refresh script
        shell: bash
        run: |
          set -uo pipefail
          S=/root/.hermes/scripts/refresh-singbox-subscription.py
          echo "=== where rules are defined ==="
          grep -n "rules\|route\|domain_suffix\|final\|outbound" "$S" | head -20
          echo "=== rules section body ==="
          sed -n "$(grep -n 'rules' "$S" | head -1 | cut -d: -f1),+40p" "$S"
