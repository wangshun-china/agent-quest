name: SB Route Check

on:
  workflow_dispatch:

jobs:
  check:
    name: Verify GHCR route survived auto-refresh cycles
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Print current first rules and ghcr probe
        shell: bash
        run: |
          set -uo pipefail
          echo "=== config mtime (refresh touches it?) ==="
          stat -c '%y %n' /data/singbox/config.json | head -1
          echo "=== first 2 route rules now ==="
          python3 -c "
          import json
          cfg = json.load(open('/data/singbox/config.json'))
          for r in cfg['route']['rules'][:2]:
              print(json.dumps(r, ensure_ascii=False)[:200])
          "
          echo "=== ghcr probe via current route ==="
          curl -sS -o /dev/null -w "http=%{http_code}\n" --max-time 15 -x http://127.0.0.1:7890 https://ghcr.io/v2/ || true
