name: ACR Speed Test

on:
  workflow_dispatch:

jobs:
  from-github-us:
    name: ACR push speed from github-us
    runs-on: ubuntu-latest
    steps:
      - name: Login ACR
        shell: bash
        run: printf '%s' "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com" -u "aliyun4384550071" --password-stdin
      - name: Create 20MB incompressible test image
        shell: bash
        run: |
          dd if=/dev/urandom of=/tmp/blob bs=1M count=20 status=none
          tar -cf /tmp/layer.tar -C /tmp blob
          docker import /tmp/layer.tar "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com/wangshun_build/speedtest:from-us"
      - name: Timed 20MB push
        shell: bash
        run: |
          START=$(date +%s)
          timeout 600 docker push "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com/wangshun_build/speedtest:from-us"
          END=$(date +%s); SECS=$((END-START))
          echo "=============================================="
          echo "SITE=github-us pushed ~20MB in ${SECS}s => $((20*1024/(SECS>0?SECS:1))) KB/s"
          echo "=============================================="

  from-aliyun-cn:
    name: ACR push speed from aliyun-cn
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Login ACR
        shell: bash
        run: printf '%s' "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com" -u "aliyun4384550071" --password-stdin
      - name: Create 20MB incompressible test image
        shell: bash
        run: |
          dd if=/dev/urandom of=/tmp/blob bs=1M count=20 status=none
          tar -cf /tmp/layer.tar -C /tmp blob
          docker import /tmp/layer.tar "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com/wangshun_build/speedtest:from-cn"
      - name: Timed 20MB push
        shell: bash
        run: |
          START=$(date +%s)
          timeout 600 docker push "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com/wangshun_build/speedtest:from-cn"
          END=$(date +%s); SECS=$((END-START))
          echo "=============================================="
          echo "SITE=aliyun-cn pushed ~20MB in ${SECS}s => $((20*1024/(SECS>0?SECS:1))) KB/s"
          echo "=============================================="
