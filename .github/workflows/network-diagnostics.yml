name: Port Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    name: Who holds port 3306 on this host
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Port 3306 holders
        shell: bash
        run: |
          echo "=== containers publishing 3306 ==="
          docker ps -a --filter publish=3306 --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "=== all mysql-ish containers ==="
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -iE "mysql|maria" || echo "(none)"
          echo "=== ss listen 3306 ==="
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep 3306 || echo "(nothing)"
          echo "=== lumina containers state ==="
          docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -i lumina || echo "(no lumina containers)"
