name: Mirror Pull Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test DaoCloud mirror for GHCR blobs
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Pull real image via DaoCloud mirror
        shell: bash
        run: |
          set -uo pipefail
          # control-plane 镜像,relay 一直拉不下来的那个(tag 为 无横杠拼接 格式)
          SHA=95cd47f7eee4a9028a9dfe53efe708739fd27f88
          echo "=== via DaoCloud mirror (180s cap) ==="
          time timeout 180 docker pull "docker.m.daocloud.io/ghcr.io/wangshun-china/lumina-rpc:control-plane$SHA" || echo "MIRROR PULL FAILED"
          echo "=== via direct GHCR for comparison (60s cap) ==="
          time timeout 60 docker pull "ghcr.io/wangshun-china/lumina-rpc:control-plane$SHA" || echo "DIRECT PULL FAILED (expected at peak)"
