name: Network Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Registry and proxy diagnostics
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Proxy state
        shell: bash
        run: |
          echo "=== shell proxy env ==="
          env | grep -iE 'proxy' || echo "(none)"
          echo "=== docker daemon proxy (docker info) ==="
          docker info 2>/dev/null | grep -iE 'http proxy|https proxy|no proxy' || echo "(none visible)"
          echo "=== systemd drop-in ==="
          cat /etc/systemd/system/docker.service.d/*.conf 2>/dev/null || echo "(no drop-in)"
          echo "=== port 7890 listening? ==="
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep 7890 || echo "(nothing listening on 7890)"

      - name: Connectivity tests
        shell: bash
        run: |
          echo "=== curl DIRECT -> ghcr.io (20s cap) ==="
          curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 20 https://ghcr.io/v2/ || echo "DIRECT GHCR FAIL"
          echo "=== curl VIA PROXY 127.0.0.1:7890 -> ghcr.io (20s cap) ==="
          curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 20 -x http://127.0.0.1:7890 https://ghcr.io/v2/ || echo "PROXY FAIL"
          echo "=== curl DIRECT -> ACR cn-shanghai (15s cap) ==="
          curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 15 https://crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com/v2/ || echo "DIRECT ACR FAIL"

      - name: Real docker pull tests
        shell: bash
        run: |
          SHA=b1a2fcee4e39b72994128da1f953ba74dffae8bc
          echo "=== docker pull GHCR dashboard image (180s cap) ==="
          time timeout 180 docker pull "ghcr.io/wangshun-china/lumina-rpc:dashboard-$SHA" || echo "GHCR PULL FAILED"
          echo "=== docker pull ACR command image - the one that failed (120s cap) ==="
          time timeout 120 docker pull "crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com/wangshun_build/lumina-rpc:command-$SHA" || echo "ACR PULL FAILED"
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E "lumina|agent-quest" | head -10
