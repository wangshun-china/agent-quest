name: Mirror Pull Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Add ghcr.wangshun.work to docker NO_PROXY
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Update NO_PROXY and restart docker
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ghcr.wangshun.work" /etc/systemd/system/docker.service.d/10-docker-proxy.conf || \
            sed -i 's/^Environment="NO_PROXY=\(.*\)"$/Environment="NO_PROXY=\1,ghcr.wangshun.work"/' \
              /etc/systemd/system/docker.service.d/10-docker-proxy.conf
          systemctl daemon-reload
          systemctl restart docker
          sleep 20
          docker info 2>/dev/null | grep -i "no proxy"
          echo "=== containers ==="
          docker ps --format '{{.Names}} {{.Status}}' | head -8
