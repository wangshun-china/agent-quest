name: Cleanup Lumina Containers

on:
  workflow_dispatch:

jobs:
  clean:
    name: Remove all lumina containers on aliyun (keep volumes)
    runs-on: [self-hosted, aliyun]
    steps:
      - name: List then remove lumina containers
        shell: bash
        run: |
          set -uo pipefail
          echo "=== before: lumina containers ==="
          docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -i lumina || echo "(none)"
          IDS=$(docker ps -a --format '{{.Names}}' | grep -i lumina)
          if [ -n "$IDS" ]; then
            echo "$IDS" | xargs -r docker rm -f
            echo "=== removed ==="
          fi
          echo "=== after: lumina containers ==="
          docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -i lumina || echo "(none)"
          echo "=== volumes preserved ==="
          docker volume ls --format '{{.Name}}' | grep -i lumina || echo "(no lumina volumes)"
