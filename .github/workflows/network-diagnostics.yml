name: ACR Speed Test

on:
  workflow_dispatch:

jobs:
  ghcr-pull-via-proxy:
    name: Timed GHCR pull from aliyun (via sing-box proxy)
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Confirm routing (must go via proxy, not direct)
        shell: bash
        run: |
          echo "=== docker daemon proxy state ==="
          docker info 2>/dev/null | grep -iE "http proxy|no proxy" | head -3
          echo "=== sing-box port ==="
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep 7890 || echo "SING-BOX NOT LISTENING"

      - name: Timed anonymous pull of public lumina dashboard image
        shell: bash
        run: |
          set -uo pipefail
          # 包已公开,匿名可拉;tag 为 无横杠拼接格式
          IMAGE="ghcr.io/wangshun-china/lumina-rpc:dashboard7a824ba222bcb4d939495973e92efa263d69cbfb"
          docker image rm "$IMAGE" 2>/dev/null || true
          START=$(date +%s)
          if timeout 240 docker pull "$IMAGE"; then
            END=$(date +%s); SECS=$((END-START))
            SIZE=$(docker image inspect "$IMAGE" --format '{{.Size}}')
            MBS=$((SIZE/1048576))
            echo "=============================================="
            echo "aliyun ->(proxy)-> GHCR pulled ${MBS}MB in ${SECS}s => $((MBS*1024/(SECS>0?SECS:1))) KB/s"
            echo "=============================================="
          else
            echo "=============================================="
            echo "PULL FAILED/CAPPED within 240s (throughput < image size / 240s)"
            echo "=============================================="
          fi
