name: Mirror Pull Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Pull real ghcr-hosted public image via CF mirror
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Pull home-assistant (~1GB) via mirror
        shell: bash
        run: |
          set -uo pipefail
          echo "=== docker pull ghcr.io/home-assistant/home-assistant:stable via CF mirror (300s cap) ==="
          time timeout 300 docker pull "ghcr.wangshun.work/home-assistant/home-assistant:stable" || echo "MIRROR PULL FAILED"
          echo "=== direct ghcr.io for comparison (300s cap) ==="
          time timeout 300 docker pull "ghcr.io/home-assistant/home-assistant:stable" || echo "DIRECT PULL FAILED"
          echo "=== via mirror images now local ==="
          docker image ls "ghcr.wangshun.work/*" --format '{{.Repository}}:{{.Tag}} {{.Size}}'
