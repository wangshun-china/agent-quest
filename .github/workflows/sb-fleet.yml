name: SB Fleet Speed Sweep

on:
  workflow_dispatch:

jobs:
  sweep:
    name: Throughput-rank all nodes, then GHCR blob test on top nodes
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Sweep
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PYEOF'
          import json, subprocess, time, shutil, urllib.request, os

          CFG = "/data/singbox/config.json"
          BASE = "/data/singbox/config.json.fleet-base"
          shutil.copy(CFG, BASE)

          def run(cmd, timeout=90):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)

          cfg = json.load(open(CFG))
          nodes = [ob["tag"] for ob in cfg.get("outbounds", [])
                   if ob.get("type") in ("vless", "hysteria2", "vmess", "trojan", "shadowsocks")]
          print(f"probing {len(nodes)} nodes\n")

          def route(tag, domains):
              c = json.load(open(BASE))
              rule = {"domain_suffix": domains, "outbound": tag}
              c.setdefault("route", {}).setdefault("rules", []).insert(0, rule)
              json.dump(c, open(CFG, "w"), ensure_ascii=False, indent=2)
              chk = run("docker exec sing-box sing-box check -c /etc/sing-box/config.json")
              if chk.returncode != 0: return False
              run("docker restart sing-box"); time.sleep(7)
              return True

          results = []
          for tag in nodes:
              ok = route(tag, ["speed.cloudflare.com"])
              if not ok:
                  print(f"{tag}\tCONFIG-FAIL"); continue
              r = run("curl -sS -o /dev/null -w '%{speed_download}' --max-time 20 -x http://127.0.0.1:7890 'https://speed.cloudflare.com/__down?bytes=26214400'", timeout=30)
              try:
                  kbps = int(float(r.stdout.strip() or 0) // 1024)
              except ValueError:
                  kbps = 0
              results.append((kbps, tag))
              print(f"{tag}\t{kbps} KB/s")

          results.sort(reverse=True)
          print("\n==== RANKING (top 8) ====")
          for kbps, tag in results[:8]:
              print(f"{kbps:8d} KB/s  {tag}")

          top = [t for k, t in results[:3] if k >= 1024]
          if not top:
              print("NO NODE >= 1MB/s")
              shutil.copy(BASE, CFG); run("docker restart sing-box")
              raise SystemExit(0)

          print(f"\n==== GHCR real-blob test on: {top} ====")
          def ghcr_blob_speed(tag):
              if not route(tag, ["ghcr.io", "pkg-containers.githubusercontent.com",
                                 "objects.githubusercontent.com", "githubusercontent.com"]):
                  return "config-fail", 0
              proxy = urllib.request.ProxyHandler({"https": "http://127.0.0.1:7890", "http": "http://127.0.0.1:7890"})
              op = urllib.request.build_opener(proxy)
              try:
                  tok = json.load(op.open("https://ghcr.io/token?scope=repository:wangshun-china/lumina-rpc:pull", timeout=20))["token"]
                  req = urllib.request.Request(
                      "https://ghcr.io/v2/wangshun-china/lumina-rpc/manifests/dashboard7a824ba222bcb4d939495973e92efa263d69cbfb",
                      headers={"Authorization": f"Bearer {tok}",
                               "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"})
                  m = json.load(op.open(req, timeout=30))
                  if "manifests" in m:
                      req2 = urllib.request.Request(
                          "https://ghcr.io/v2/wangshun-china/lumina-rpc/manifests/" + m["manifests"][0]["digest"],
                          headers={"Authorization": f"Bearer {tok}",
                                   "Accept": "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"})
                      m = json.load(op.open(req2, timeout=30))
                  layers = sorted(m.get("layers", []), key=lambda l: l.get("size", 0), reverse=True)
                  if not layers: return "no-layers", 0
                  layer = layers[0]
                  size = layer["size"]
                  rq = urllib.request.Request(
                      "https://ghcr.io/v2/wangshun-china/lumina-rpc/blobs/" + layer["digest"],
                      headers={"Authorization": f"Bearer {tok}"})
                  t0 = time.time(); got = 0
                  with op.open(rq, timeout=120) as resp:
                      while True:
                          chunk = resp.read(1 << 20)
                          if not chunk: break
                          got += len(chunk)
                          if time.time() - t0 > 45: break
                  secs = time.time() - t0
                  kbps = int(got // 1024 // max(secs, 0.1))
                  return f"{got//1048576}MB/{secs:.0f}s", kbps
              except Exception as e:
                  return f"ERR {type(e).__name__}: {str(e)[:60]}", 0

          best = None
          for tag in top:
              info, kbps = ghcr_blob_speed(tag)
              print(f"{tag}\t{info}\t{kbps} KB/s")
              if kbps >= 1024 and (best is None or kbps > best[1]):
                  best = (tag, kbps)

          if best:
              print(f"\nBEST GHCR NODE: {best[0]} at {best[1]} KB/s - switching route to it")
              route(best[0], ["ghcr.io", "pkg-containers.githubusercontent.com",
                              "objects.githubusercontent.com", "githubusercontent.com"])
          else:
              print("\nno node passed GHCR blob test at >=1MB/s; restoring base")
              shutil.copy(BASE, CFG); run("docker restart sing-box")
          PYEOF
