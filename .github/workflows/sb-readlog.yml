name: SB Read Probe Log

on:
  workflow_dispatch:

jobs:
  read:
    name: Cat fleet-probe.log (read-only)
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Dump probe log
        shell: bash
        run: |
          echo "=== fleet-probe.log ($(wc -l < /data/singbox/fleet-probe.log 2>/dev/null || echo 0) lines) ==="
          cat /data/singbox/fleet-probe.log 2>/dev/null || echo "(missing)"
