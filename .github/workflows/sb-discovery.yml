name: SB Discovery

on:
  workflow_dispatch:

jobs:
  discover:
    name: Find subscription/update mechanism (read-only)
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Search for subscription artifacts
        shell: bash
        run: |
          set -uo pipefail
          echo "=== /data/singbox contents ==="
          ls -la /data/singbox/ | head -20
          echo "=== scripts referencing subscribe/update in /data and /root ==="
          grep -rlsE "subscribe|sub\?|api/v1/client/subscribe|sing-box" /data/singbox/*.sh /root/*.sh 2>/dev/null | head -5 || true
          echo "=== host crontab ==="
          crontab -l 2>/dev/null | grep -vE "^#" | head -10 || echo "(empty)"
          echo "=== sing-box container env/cmd ==="
          docker inspect sing-box --format 'cmd={{.Config.Cmd}} entry={{.Config.Entrypoint}}' 2>/dev/null
          docker inspect sing-box --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -viE "path|home" | head -6
          echo "=== any compose file for sing-box ==="
          ls /data/singbox/docker-compose.y*ml /data/docker-compose.y*ml 2>/dev/null || true
          grep -l "sing-box" /data/*/docker-compose.y*ml 2>/dev/null || true
