name: SB Route GHCR via HK

on:
  workflow_dispatch:

jobs:
  patch-and-test:
    name: Route GHCR domains to HK node, then timed pull
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Backup, patch, validate, restart sing-box
        shell: bash
        run: |
          set -euo pipefail
          CFG=/data/singbox/config.json
          cp "$CFG" "$CFG.bak-hkroute"
          python3 - "$CFG" <<'PYEOF'
          import sys, json
          path = sys.argv[1]
          cfg = json.load(open(path))
          rule = {
              "domain_suffix": [
                  "ghcr.io",
                  "pkg-containers.githubusercontent.com",
                  "objects.githubusercontent.com",
                  "githubusercontent.com",
                  "githubassets.com"
              ],
              "outbound": "\U0001F1ED\U0001F1F0\u9999\u6e2f\u4e13\u7ebf02"
          }
          rules = cfg.setdefault("route", {}).setdefault("rules", [])
          # insert at top so it shadows the github->direct rule below
          rules.insert(0, rule)
          json.dump(cfg, open(path, "w"), ensure_ascii=False, indent=2)
          print("rule inserted at top; total rules:", len(rules))
          PYEOF
          if ! docker exec sing-box sing-box check -c /etc/sing-box/config.json; then
            echo "CONFIG INVALID - rolling back"
            cp "$CFG.bak-hkroute" "$CFG"
            docker restart sing-box
            exit 1
          fi
          docker restart sing-box
          sleep 8
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep 7890 || { echo "sing-box did not come back on 7890 - rolling back"; cp "$CFG.bak-hkroute" "$CFG"; docker restart sing-box; exit 1; }
          echo "sing-box restarted with HK route"

      - name: Verify exit node is HK
        shell: bash
        run: |
          set -uo pipefail
          echo "--- exit location via proxy ---"
          curl -sS --max-time 20 -x http://127.0.0.1:7890 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E "^(ip|loc|colo)=" || echo "trace failed"
          echo "--- ghcr API via proxy (expect 401 challenge, NOT denied) ---"
          curl -sS -o /dev/null -w "http=%{http_code}\n" --max-time 20 -x http://127.0.0.1:7890 https://ghcr.io/v2/

      - name: Timed real pull via HK node
        shell: bash
        run: |
          set -uo pipefail
          IMAGE="ghcr.io/wangshun-china/lumina-rpc:dashboard7a824ba222bcb4d939495973e92efa263d69cbfb"
          docker image rm "$IMAGE" 2>/dev/null || true
          START=$(date +%s)
          if timeout 300 docker pull "$IMAGE"; then
            END=$(date +%s); SECS=$((END-START))
            SIZE=$(docker image inspect "$IMAGE" --format '{{.Size}}')
            MBS=$((SIZE/1048576))
            echo "RESULT route=hk-direct-line pulled ${MBS}MB in ${SECS}s => $((MBS*1024/(SECS>0?SECS:1))) KB/s"
          else
            echo "RESULT route=hk-direct-line PULL FAILED OR CAPPED (300s)"
          fi
