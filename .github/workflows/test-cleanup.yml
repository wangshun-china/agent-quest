name: Test Cleanup

on:
  workflow_dispatch:

jobs:
  clean:
    name: Delete speedtest repo images and test backups
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Delete ACR speedtest manifests
        shell: bash
        run: |
          set -uo pipefail
          REG="crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com"
          REPO="wangshun_build/speedtest"
          printf '%s' "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login "$REG" -u "aliyun4384550071" --password-stdin
          TOKEN_JSON=$(curl -sS --max-time 20 "https://dockerauth.cn-hangzhou.aliyuncs.com/auth?service=registry.docker.io&scope=repository:$REPO:delete,pull" -u "aliyun4384550071:${{ secrets.ALIYUN_ACR_PASSWORD }}")
          TOKEN=$(echo "$TOKEN_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          TAGS=$(curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" "https://$REG/v2/$REPO/tags/list" | python3 -c "import sys,json;t=json.load(sys.stdin).get('tags') or [];print(' '.join(t))" 2>/dev/null)
          echo "tags: ${TAGS:-none}"
          DELETED=0
          for t in $TAGS; do
            D=$(curl -sSI --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json" "https://$REG/v2/$REPO/manifests/$t" | grep -i "docker-content-digest" | tr -d '\r' | awk '{print $2}')
            if [ -n "$D" ]; then
              R=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X DELETE -H "Authorization: Bearer $TOKEN" "https://$REG/v2/$REPO/manifests/$D")
              echo "delete $t -> $R"; DELETED=$((DELETED+1))
            fi
          done
          echo "deleted $DELETED manifests (empty repo shell may remain; remove via ACR console if so)"

      - name: Remove sing-box test backups and probe log
        shell: bash
        run: |
          set -uo pipefail
          echo "=== before ==="
          ls -la /data/singbox/ | grep -vE "^total|^d"
          rm -f /data/singbox/config.json.bak-hkroute \
                /data/singbox/config.json.bak-hksweep \
                /data/singbox/config.json.bak-hksweep2 \
                /data/singbox/config.json.pre-refresh \
                /data/singbox/config.json.post-refresh \
                /data/singbox/config.json.fleet-base \
                /data/singbox/fleet-probe.log \
                /tmp/sb-test.json
          echo "=== after (my test artifacts gone; original .bak/.bak3/.bak-20260929 kept) ==="
          ls -la /data/singbox/ | grep -vE "^total|^d"
