name: Fleet Recon

on:
  workflow_dispatch:

jobs:
  cad2shp-inspect:
    name: Inspect dead cad2shp container config
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Full inspect
        shell: bash
        run: |
          set +e
          echo "=== image / cmd / entrypoint ==="
          docker inspect cad2shp --format 'image={{.Config.Image}}'
          docker inspect cad2shp --format 'cmd={{.Config.Cmd}} entry={{.Config.Entrypoint}}'
          echo "=== ports ==="
          docker inspect cad2shp --format '{{.HostConfig.PortBindings}}'
          echo "=== mounts ==="
          docker inspect cad2shp --format '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}}{{println}}{{end}}'
          echo "=== env (values shown once for secret migration; run log will be deleted) ==="
          docker inspect cad2shp --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -vE "^(PATH|LANG|HOME|HOSTNAME|QT_QPA)"
          echo "=== restart policy / networks ==="
          docker inspect cad2shp --format 'restart={{.HostConfig.RestartPolicy.Name}} networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
          echo "=== leftover volumes named cad2shp ==="
          docker volume ls --format '{{.Name}}' | grep -i "cad2shp\|cad" || echo "(none)"
