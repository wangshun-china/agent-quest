name: Runner Install

on:
  workflow_dispatch:

jobs:
  install:
    name: Install xixi-box repo runners on aliyun
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Clean corpses
        shell: bash
        run: |
          set +e
          systemctl stop github-runner-cad2shp github-runner-joyshock 2>/dev/null
          systemctl disable github-runner-cad2shp github-runner-joyshock 2>/dev/null
          rm -rf /data/gh-runners/cad2shp /data/gh-runners/joyshock
          rm -f /etc/systemd/system/github-runner-*.service
          systemctl daemon-reload
          echo "corpses cleaned"

      - name: Download runner package (via SG proxy line)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /data/gh-runners/pkg && cd /data/gh-runners/pkg
          time curl -sSL --max-time 300 -x http://127.0.0.1:7890 -o actions-runner-linux-x64-2.337.0.tar.gz \
            https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-linux-x64-2.337.0.tar.gz
          ls -lh actions-runner-linux-x64-2.337.0.tar.gz

      - name: Configure and start CAD2SHP runner
        shell: bash
        env:
          REG_TOKEN: AW7AZMBGKQ5SR4UES2FNB7DKX5KY2
        run: |
          set -euo pipefail
          mkdir -p /data/gh-runners/cad2shp && cd /data/gh-runners/cad2shp
          tar xzf /data/gh-runners/pkg/actions-runner-linux-x64-2.337.0.tar.gz
          RUN_ALLOW_RUNASROOT=1 ./config.sh --url https://github.com/xixi-box/CAD2SHP --token "$REG_TOKEN" \
            --labels self-hosted,aliyun --unattended --replace 2>&1 | tail -8
          ./svc.sh install github-runner-cad2shp 2>&1 | tail -2
          ./svc.sh start github-runner-cad2shp 2>&1 | tail -2
          sleep 5
          systemctl is-active github-runner-cad2shp

      - name: Configure and start JoyShockMapper runner
        shell: bash
        env:
          REG_TOKEN: JOY_TOKEN_PLACEHOLDER
        run: |
          set -euo pipefail
          mkdir -p /data/gh-runners/joyshock && cd /data/gh-runners/joyshock
          tar xzf /data/gh-runners/pkg/actions-runner-linux-x64-2.337.0.tar.gz
          RUN_ALLOW_RUNASROOT=1 ./config.sh --url https://github.com/xixi-box/JoyShockMapper --token "$REG_TOKEN" \
            --labels self-hosted,aliyun --unattended --replace 2>&1 | tail -8
          ./svc.sh install github-runner-joyshock 2>&1 | tail -2
          ./svc.sh start github-runner-joyshock 2>&1 | tail -2
          sleep 5
          systemctl is-active github-runner-joyshock

      - name: Verify
        shell: bash
        run: |
          sleep 20
          systemctl is-active github-runner-cad2shp github-runner-joyshock
          echo "listeners: $(ps aux | grep -c '[R]unner.Listener') (expect 3)"
