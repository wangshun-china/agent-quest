name: Runner Install

on:
  workflow_dispatch:

jobs:
  install:
    name: Configure runners (verbose)
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Configure CAD2SHP runner
        shell: bash
        env:
          REG_TOKEN: AW7AZMAEQB6ME2BFIJMNRYDKX5IL2
        run: |
          set -euo pipefail
          cd /data/gh-runners/cad2shp
          [ -f config.sh ] || tar xzf /data/gh-runners/pkg/actions-runner-linux-x64-2.337.0.tar.gz
          RUN_ALLOW_RUNASROOT=1 ./config.sh --url https://github.com/xixi-box/CAD2SHP --token "$REG_TOKEN" \
            --labels self-hosted,aliyun --unattended --replace 2>&1 | tail -15
          ./svc.sh install github-runner-cad2shp 2>&1 | tail -3 || true
          systemctl enable --now github-runner-cad2shp 2>&1 | tail -2 || true
          sleep 5
          systemctl is-active github-runner-cad2shp

      - name: Configure JoyShockMapper runner
        shell: bash
        env:
          REG_TOKEN: JOY_TOKEN_PLACEHOLDER
        run: |
          set -euo pipefail
          cd /data/gh-runners/joyshock
          [ -f config.sh ] || tar xzf /data/gh-runners/pkg/actions-runner-linux-x64-2.337.0.tar.gz
          RUN_ALLOW_RUNASROOT=1 ./config.sh --url https://github.com/xixi-box/JoyShockMapper --token "$REG_TOKEN" \
            --labels self-hosted,aliyun --unattended --replace 2>&1 | tail -15
          ./svc.sh install github-runner-joyshock 2>&1 | tail -3 || true
          systemctl enable --now github-runner-joyshock 2>&1 | tail -2 || true
          sleep 5
          systemctl is-active github-runner-joyshock

      - name: Verify
        shell: bash
        run: |
          sleep 20
          systemctl is-active github-runner-cad2shp github-runner-joyshock
          echo "listeners: $(ps aux | grep -c '[R]unner.Listener')"
