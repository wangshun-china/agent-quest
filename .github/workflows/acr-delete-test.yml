name: ACR Delete Experiment

on:
  workflow_dispatch:

jobs:
  experiment:
    name: Test registry v2 API tag listing and deletion
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Proper WWW-Authenticate dance, list tags, delete one known-old tag
        shell: bash
        run: |
          set -uo pipefail
          REG="crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com"
          REPO="wangshun_build/agent-quest"
          USER="aliyun4384550071"
          PASS="${{ secrets.ALIYUN_ACR_PASSWORD }}"

          echo "=== 1. discover auth realm+service from registry ==="
          WWWAUTH=$(curl -sI --max-time 20 "https://$REG/v2/" | grep -i www-authenticate | tr -d '\r')
          echo "$WWWAUTH"
          REALM=$(echo "$WWWAUTH" | grep -oE 'realm="[^"]+"' | cut -d'"' -f2)
          SERVICE=$(echo "$WWWAUTH" | grep -oE 'service="[^"]+"' | cut -d'"' -f2)
          echo "realm=$REALM service=$SERVICE"

          echo "=== 2. pull-scope token and tag list ==="
          TOKEN=$(curl -sS --max-time 20 -u "$USER:$PASS" "$REALM?service=$SERVICE&scope=repository:$REPO:pull" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          echo "token_len=${#TOKEN}"
          curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" "https://$REG/v2/$REPO/tags/list" | head -c 400; echo

          echo "=== 3. delete-scope token and delete one known-old tag ==="
          DTOKEN=$(curl -sS --max-time 20 -u "$USER:$PASS" "$REALM?service=$SERVICE&scope=repository:$REPO:delete,*" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          echo "delete_token_len=${#DTOKEN}"
          OLDTAG="45af19f91a764ed56d6db33efbe5469b420f00ef"
          DIGEST=$(curl -sSI --max-time 20 -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json" \
            "https://$REG/v2/$REPO/manifests/$OLDTAG" | grep -i docker-content-digest | tr -d '\r' | awk '{print $2}')
          echo "digest($OLDTAG)=$DIGEST"
          if [ -n "$DIGEST" ] && [ ${#DTOKEN} -gt 10 ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X DELETE \
              -H "Authorization: Bearer $DTOKEN" "https://$REG/v2/$REPO/manifests/$DIGEST")
            echo "DELETE result: HTTP $CODE (202/200=success)"
          else
            echo "DELETE skipped (no digest or no delete token)"
          fi

          echo "=== 4. verify tag gone ==="
          sleep 3
          curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" "https://$REG/v2/$REPO/tags/list" | head -c 400; echo
